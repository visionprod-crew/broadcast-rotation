<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1c1b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방송팀 로테이션">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23f6c445%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22800%22%3EV%3C/text%3E%3C/svg%3E">
<title>3시 방송팀 로테이션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f5f4f0; --card:#fff; --ink:#1c1b1f; --sub:#6d6b74; --mute:#a3a1a9; --line:#e8e6e0; --line2:#f0eee9;
  --accent:#e8892b; --accent-ink:#fff; --accent-soft:#fff2e2; --yellow:#f6c445; --yellow-soft:#fff8de;
  --danger:#e04848; --danger-soft:#fdeceb; --ok:#2c9a6a; --ok-soft:#e5f5ee; --blue:#3a6fd8; --blue-soft:#e8effc;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121114; --card:#1d1c20; --ink:#f1f0f3; --sub:#a8a6ae; --mute:#6f6d76; --line:#2e2c33; --line2:#26252a;
  --accent-soft:#3a2914; --yellow-soft:#3a3115; --danger-soft:#3b1d1d; --ok-soft:#163128; --blue-soft:#1b2640;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.hidden{display:none!important}

/* ── app shell ── */
#app{max-width:820px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1 small{display:block;font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:.06em}
.userchip{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 6px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);font-size:13px;font-weight:600}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800}
.role{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--line2);color:var(--sub)}
.role.owner{background:var(--ink);color:var(--bg)} .role.leader{background:var(--accent-soft);color:var(--accent)} .role.subleader{background:var(--blue-soft);color:var(--blue)}
.modebar{margin:0 18px 6px;font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute)} .dot.on{background:var(--ok)}

.view{padding:4px 16px 20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11.5px;font-weight:600;color:var(--mute);border-radius:12px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--ink)}

/* ── common ── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--line2);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.kakao{background:#fee500;color:#191600}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--sub)} .small{font-size:12.5px}
.section-title{font-size:13px;font-weight:700;color:var(--sub);margin:22px 4px 8px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--line2);color:var(--ink);white-space:nowrap}
.chip.absent{background:var(--danger-soft);color:var(--danger)}
.chip.spare{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--yellow-soft);color:#a7761a}
.chip.tag{background:transparent;border:1px solid var(--line);color:var(--sub);font-size:11.5px;padding:1px 7px}
.empty{text-align:center;color:var(--sub);padding:36px 12px}
.input,.select,textarea.input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:none}
textarea.input{height:auto;min-height:70px;padding:10px 14px;resize:vertical}
.input:focus{border-color:var(--ink)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 2px 6px}
.seg{display:inline-flex;background:var(--line2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ── month header ── */
.monthnav{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.monthnav .title{flex:1;text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.monthnav .title small{display:block;font-size:12px;color:var(--sub);font-weight:600;letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{padding:11px 12px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--sub);font-weight:600}

/* ── service card ── */
.svc{padding:0;overflow:hidden;margin-bottom:12px}
.svc-head{display:flex;align-items:center;gap:10px;padding:13px 14px 11px;border-bottom:1px solid var(--line2)}
.svc-date{font-size:17px;font-weight:800;letter-spacing:-.01em}
.svc-date .dow{color:var(--sub);font-weight:600;font-size:14px;margin-left:2px}
.badge{white-space:nowrap;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--accent);color:#fff}
.badge.past{background:var(--line2);color:var(--mute)}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pos{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line2);min-width:0}
.pos:nth-child(odd){border-right:1px solid var(--line2)}
.pos .lbl{width:70px;flex:none;line-height:1.15}
.pos .lbl b{display:block;font-size:12.5px;font-weight:700}
.pos .lbl i{font-style:normal;font-size:11px;color:var(--mute);font-weight:600}
.pos .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos .nm.none{color:var(--mute);font-weight:500}
.pos .nm.bad{color:var(--danger)}
.svc-foot{padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px}
.svc-foot .line{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.svc-foot .k{font-size:12px;font-weight:700;color:var(--sub);width:58px;flex:none;padding-top:3px}
.svc-actions{display:flex;gap:8px;padding:0 14px 14px}
.svc.past{opacity:.82}
.memo{font-size:13px;color:var(--sub);padding:8px 14px 0}

/* table view */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius)}
table.rt{border-collapse:collapse;min-width:760px;width:100%;font-size:13.5px;background:var(--card)}
table.rt th{background:var(--yellow);color:#2b2200;font-weight:700;padding:6px 6px;border:1px solid rgba(0,0,0,.12);line-height:1.2;font-size:12.5px}
table.rt th small{display:block;font-weight:600;opacity:.75}
table.rt td{border:1px solid var(--line);padding:9px 6px;text-align:center;white-space:nowrap}
table.rt td.d{font-weight:700}
table.rt tr{cursor:pointer}
table.rt tr:hover td{background:var(--line2)}
table.rt td.ab{color:var(--danger);font-size:12px;white-space:normal}

/* ── sheets ── */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,10,12,.42);animation:fade .18s}
.sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:22px;max-height:86vh}}
.sheet .ph{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet .ph h2{flex:1;margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sheet .pb{overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.sheet .pf{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

.slot{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left}
.slot .lbl{width:92px;flex:none;line-height:1.2}
.slot .lbl b{display:block;font-size:13.5px;font-weight:800}
.slot .lbl i{font-style:normal;font-size:11.5px;color:var(--mute);font-weight:600}
.slot .v{flex:1;font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.slot .v.none{color:var(--mute);font-weight:500;font-size:14.5px}
.slot .chev{color:var(--mute)}
.slot.warn{border-color:#f0c77a;background:var(--yellow-soft)}

.pick{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:13px;text-align:left;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
.pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick .nm{font-weight:700;font-size:15.5px}
.pick .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.pick .chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.pick.on .chk{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick .cnt{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.pick.dim .nm{color:var(--sub)}
.grp{font-size:12px;font-weight:800;color:var(--sub);margin:16px 2px 8px;letter-spacing:.03em}

/* members */
.mem{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.mem:last-child{border-bottom:0}
.mem .av{width:40px;height:40px;border-radius:13px;background:var(--line2);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.mem .av.leader{background:var(--accent-soft);color:var(--accent)}
.mem .nm{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mem .age{font-size:12px;color:var(--sub);font-weight:700}
.mem .sub{font-size:12.5px;color:var(--sub);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mem.off .nm>span:first-child{text-decoration:line-through;color:var(--mute)}
.callbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.callbtn svg{width:18px;height:18px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--sub);background:var(--card)}
.tagpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px}
.tgl{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on{background:var(--ok)} .tgl.on::after{left:21px}

/* weekly */
.datestrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:none;padding:9px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);text-align:center;line-height:1.2}
.dchip b{display:block;font-size:15px;font-weight:800}
.dchip span{font-size:11px;color:var(--sub);font-weight:600}
.dchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.on span{color:var(--bg);opacity:.7}
.preview{padding:14px;display:flex;justify-content:center;background:repeating-conic-gradient(var(--line2) 0 25%,transparent 0 50%) 0 0/18px 18px;border-radius:var(--radius);border:1px solid var(--line)}
.preview img{max-width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 6px 22px rgba(0,0,0,.12)}
.sharebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sharebar .wide{grid-column:1/-1;height:50px;font-size:15.5px}

/* settings list */
.list{overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--line2);flex:none}
.li .ic svg{width:18px;height:18px}
.li b{font-weight:700;font-size:15px}
.li .d{font-size:12.5px;color:var(--sub)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:380px}
.brand{font-size:12px;letter-spacing:.22em;font-weight:800;color:var(--accent);margin-bottom:6px}
.login h1{font-size:28px;margin:0 0 4px;letter-spacing:-.03em;font-weight:800}
.err{color:var(--danger);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:200;animation:up .2s;max-width:90vw;text-align:center}
.fab{position:fixed;right:max(18px,calc(50% - 392px));bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:25}
.fab svg{width:26px;height:26px}
.searchbox{position:relative;margin-bottom:10px}
.searchbox svg{position:absolute;left:13px;top:13px;width:20px;height:20px;color:var(--mute)}
.searchbox .input{padding-left:40px}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cnt-item{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700}
.cnt-item span{font-size:12px;color:var(--sub);font-weight:600}
.cnt-item.zero{opacity:.55}
.an-card{padding:12px 14px;margin-bottom:10px}
.an-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.an-head>b{font-size:16px;font-weight:800}
.an-last{font-size:13px}
.an-last b{color:var(--accent)}
.an-row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
.an-k{width:52px;flex:none;font-size:12.5px;font-weight:800;line-height:1.25}
.an-k small{display:block;font-weight:600;color:var(--mute);font-size:11.5px}
.an-v{flex:1;min-width:0}
.an-bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line2);gap:2px;margin:3px 0 7px}
.an-bar i{display:block;min-width:4px}
.an-chips{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-weight:600}
.an-chips span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.an-chips b,.an-legend b{width:9px;height:9px;border-radius:3px;display:inline-block}
.an-chips em{font-style:normal;color:var(--sub);font-weight:700}
.an-chips .ab{color:var(--danger)}
.an-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);font-weight:600;margin:0 2px 12px}
.an-legend span{display:inline-flex;align-items:center;gap:5px}
.pk-an{font-size:12.5px;color:var(--sub);margin-top:2px}
.pk-an b{color:var(--ink)}
.banner{padding:14px;border-radius:14px;background:var(--yellow-soft);border:1px solid #f1d58a;font-size:13.5px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.banner{border-color:#5a4a1d}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheets"></div>
<script src="config.js?v=3"></script>
<script src="seed.js?v=3"></script>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
